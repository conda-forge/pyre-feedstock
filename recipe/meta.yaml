{% set version = "1.13.1" %}

package:
  name: pyre
  version: {{ version }}

source:
  - url: https://github.com/pyre/pyre/archive/v{{ version }}.tar.gz
    sha256: 1da16a27c8055ee724b8c2e6057f97f93f55325931ea27da217689a3e445bfda
    patches:

build:
  number: 0
  # the python floor is 3.11 as of v1.13.0
  skip: true  # [win or py<311 or python_impl == 'pypy']

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - pybind11                               # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake
    - make  # [unix]
  host:
    - hdf5
    - numpy
    - pybind11
    - python
    - zip
  run:
    - python
    # the yaml configuration codec; a declared dependency of the python package
    - pyyaml
    # the round trip editor of yaml configuration files and the persistence of component
    # state ride on it; optional for pip, where it is the {editing} extra, included here
    - ruamel.yaml

test:
  requires:
    # the yaml codec rides on pyyaml, and the round trip editor of yaml configuration files
    # on ruamel.yaml; the tests of the latter skip themselves when it is absent
    - pyyaml
    - ruamel.yaml
  commands:
    # the extension modules must be loaded, not merely present: {import pyre} succeeds even
    # when the core extension cannot be loaded, since the package swallows that failure and
    # sets {pyre.libpyre} to {None}, which is how v1.12.6 shipped on osx-arm64 with grid and
    # memory bindings that could not be used
    - python -c "import pyre, journal, pyre.h5; assert pyre.libpyre is not None, 'the pyre bindings did not load'; assert journal.libjournal is not None, 'the journal bindings did not load'; assert pyre.h5.libh5 is not None, 'the h5 bindings did not load'"
    # a component of each kind of binding does something
    - python -c "import pyre; import pyre.memory, pyre.grid; b = pyre.memory.heap(type=pyre.memory.cells.double(), cells=16); assert b.cells == 16"
    - python -c "import journal; c = journal.info('pyre.conda'); c.device = journal.trash(); c.log('the conda package works')"
    # the project generator finds its templates in the installation
    - python -c "import pyre; assert (pyre.prefix / 'share' / 'pyre' / 'templates' / 'basic').isDirectory(), str(pyre.prefix)"
  imports:
    - pyre
    - journal

about:
  home: http://pyre.orthologue.com
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A Python framework for scientific applications

  description: |
    An open source application framework for building
    scalable, user-friendly scientific applications.

  dev_url: https://github.com/pyre/pyre
  doc_url: http://pyre.orthologue.com/docs

extra:
  recipe-maintainers:
    - aivazis
    - rtburns-jpl
